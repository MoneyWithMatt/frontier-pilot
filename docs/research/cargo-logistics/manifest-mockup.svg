<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1410" viewBox="0 0 1320 1410" role="img"><title>Illustrative Frontier Pilot multi-stop dispatch sheet; design only</title><rect x="50" y="25" width="1220" height="1360" fill="#f5f2e9" /><circle cx="34" cy="67" r="7" fill="#b5b9b0" /><circle cx="1288" cy="67" r="7" fill="#b5b9b0" /><circle cx="34" cy="152" r="7" fill="#b5b9b0" /><circle cx="1288" cy="152" r="7" fill="#b5b9b0" /><circle cx="34" cy="237" r="7" fill="#b5b9b0" /><circle cx="1288" cy="237" r="7" fill="#b5b9b0" /><circle cx="34" cy="322" r="7" fill="#b5b9b0" /><circle cx="1288" cy="322" r="7" fill="#b5b9b0" /><circle cx="34" cy="407" r="7" fill="#b5b9b0" /><circle cx="1288" cy="407" r="7" fill="#b5b9b0" /><circle cx="34" cy="492" r="7" fill="#b5b9b0" /><circle cx="1288" cy="492" r="7" fill="#b5b9b0" /><circle cx="34" cy="577" r="7" fill="#b5b9b0" /><circle cx="1288" cy="577" r="7" fill="#b5b9b0" /><circle cx="34" cy="662" r="7" fill="#b5b9b0" /><circle cx="1288" cy="662" r="7" fill="#b5b9b0" /><circle cx="34" cy="747" r="7" fill="#b5b9b0" /><circle cx="1288" cy="747" r="7" fill="#b5b9b0" /><circle cx="34" cy="832" r="7" fill="#b5b9b0" /><circle cx="1288" cy="832" r="7" fill="#b5b9b0" /><circle cx="34" cy="917" r="7" fill="#b5b9b0" /><circle cx="1288" cy="917" r="7" fill="#b5b9b0" /><circle cx="34" cy="1002" r="7" fill="#b5b9b0" /><circle cx="1288" cy="1002" r="7" fill="#b5b9b0" /><circle cx="34" cy="1087" r="7" fill="#b5b9b0" /><circle cx="1288" cy="1087" r="7" fill="#b5b9b0" /><circle cx="34" cy="1172" r="7" fill="#b5b9b0" /><circle cx="1288" cy="1172" r="7" fill="#b5b9b0" /><circle cx="34" cy="1257" r="7" fill="#b5b9b0" /><circle cx="1288" cy="1257" r="7" fill="#b5b9b0" /><circle cx="34" cy="1342" r="7" fill="#b5b9b0" /><circle cx="1288" cy="1342" r="7" fill="#b5b9b0" /><text font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="700" x="85" y="92" fill="#292b2a">FRONTIER PILOT / CARGO MANIFEST</text><text font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" x="85" y="128" fill="#292b2a">DESIGN STUDY — SYNTHETIC DATA — NOT A LIVE DISPATCH</text><line x1="85" y1="152" x2="1235" y2="152" stroke="#95978e" /><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" x="85" y="196" fill="#292b2a">DISPATCH  EXAMPLE-042 / REV 02</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="235" fill="#292b2a">OPERATOR  EROS COMMUNITY AVIATION (ILLUSTRATIVE)</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="273" fill="#292b2a">AIRFRAME  SELECTED REGISTRATION / C208 EXAMPLE</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="311" fill="#292b2a">SERVICE   DEST-A (FICTIONAL STOP)    ORIGIN FYWE (EXAMPLE)</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="349" fill="#292b2a">STATE     DELIVERY PREVIEW          TIME  -- UTC</text><line x1="85" y1="374" x2="1235" y2="374" stroke="#95978e" /><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" x="85" y="417" fill="#292b2a">CONSIGNMENTS ABOARD / BEFORE THIS HANDLING ACTION</text><text font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" x="85" y="466" fill="#292b2a">JOB</text><text font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" x="260" y="466" fill="#292b2a">DESCRIPTION</text><text font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" x="682" y="466" fill="#292b2a">DELIVER TO</text><text font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" x="930" y="466" fill="#292b2a">ABOARD</text><text font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" x="1090" y="466" fill="#292b2a">ACTION</text><line x1="85" y1="483" x2="1235" y2="483" stroke="#95978e" /><rect x="77" y="494" width="1165" height="86" fill="#e8e6dd" /><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" x="85" y="528" fill="#292b2a">FP-101</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="400" x="260" y="528" fill="#292b2a">MEDICAL SUPPLIES</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="400" x="682" y="528" fill="#292b2a">DEST-A</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="400" x="930" y="528" fill="#292b2a">10 kg</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" x="1090" y="528" fill="#292b2a">UNLOAD</text><text font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" x="260" y="564" fill="#292b2a">Origin FYWE / resource and job remain linked</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" x="85" y="631" fill="#292b2a">FP-102</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="400" x="260" y="631" fill="#292b2a">FOOD SUPPLIES</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="400" x="682" y="631" fill="#292b2a">DEST-B</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="400" x="930" y="631" fill="#292b2a">25 kg</text><text font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" x="1090" y="631" fill="#292b2a">RETAIN</text><text font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" x="260" y="667" fill="#292b2a">Origin FYWE / continuing on next leg</text><line x1="85" y1="698" x2="1235" y2="698" stroke="#95978e" /><text font-family="Consolas, 'Courier New', monospace" font-size="23" font-weight="700" x="85" y="743" fill="#292b2a">THIS STOP: 35 kg BEFORE — 10 kg DELIVERY = 25 kg RETAINED</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700" x="85" y="785" fill="#292b2a">INSTRUCTIONS</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="823" fill="#292b2a">1. Deliver FP-101 only; verify the requested payload change.</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="860" fill="#292b2a">2. Keep all 25 kg of FP-102 aboard for DEST-B.</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="897" fill="#292b2a">3. New pickups join the next leg after confirmed loading.</text><line x1="85" y1="927" x2="1235" y2="927" stroke="#95978e" /><text font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" x="85" y="968" fill="#292b2a">ONE SHARED STATION — ILLUSTRATIVE, NOT AN AIRCRAFT MAPPING</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="1010" fill="#292b2a">Other payload: 12 kg | Frontier before: 35 kg | Total: 47 kg</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="1048" fill="#292b2a">After A:      12 kg + retained B 25 kg        = 37 kg</text><text font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="400" x="85" y="1086" fill="#292b2a">After B:      12 kg + Frontier 0 kg           = 12 kg</text><text font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="400" x="85" y="1124" fill="#292b2a">All other stations, occupants and fuel remain unchanged.</text><line x1="85" y1="1150" x2="1235" y2="1150" stroke="#95978e" /><text font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="400" x="85" y="1189" fill="#292b2a">PASSENGERS  Separate booking rows shown only when present.</text><text font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" x="85" y="1224" fill="#292b2a">READBACK    PREVIEW ONLY / no simulator confirmation in this study.</text><text font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" x="85" y="1260" fill="#292b2a">PLANNING    Weight, balance and performance remain pilot decisions.</text><text font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" x="85" y="1320" fill="#292b2a">END OF SHEET / live revision differs from an archived printout</text></svg>